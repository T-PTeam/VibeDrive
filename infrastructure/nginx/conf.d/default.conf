upstream backend_php {
    server vibedrive-backend-php:9000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;
    resolver 127.0.0.11 valid=30s;

    set $backend_php_url vibedrive-backend-php;
    set $api_net vibedrive-api:8080;
    set $mobile_backend mobile-app:8081;

    location / {

        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location /api/audio/ {
        root /var/www/html;
        try_files $uri $uri/ /api/audio/upload.php?$query_string;
        fastcgi_pass backend_php;
        fastcgi_index upload.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location = /api/ping {
        fastcgi_pass backend_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 10s;
        include fastcgi_params;
    }

    location = /api/login {
        fastcgi_pass backend_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_connect_timeout 10s;
        fastcgi_read_timeout 30s;
        include fastcgi_params;
    }

    location /api/ {
        proxy_pass http://$api_net/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /driverhub {
        proxy_pass http://$api_net/driverhub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass backend_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location /mobile {
        proxy_pass http://$mobile_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ /\.ht {
        deny all;
    }
}

