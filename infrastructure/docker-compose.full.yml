services:
  redis:
    image: redis:7-alpine
    container_name: vibedrive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - vibedrive-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: vibedrive-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vibedrive_db
      MYSQL_USER: vibedrive
      MYSQL_PASSWORD: vibedrive
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibedrive-network
    restart: unless-stopped

  backend-php:
    build:
      context: ../backend-php
      dockerfile: Dockerfile
    container_name: vibedrive-backend-php
    volumes:
      - ../backend-php:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vibedrive_db
      - DB_USERNAME=vibedrive
      - DB_PASSWORD=vibedrive
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibedrive-network
    restart: unless-stopped

  api:
    build:
      context: ../microservice-net
      dockerfile: VibeDrive.Api/Dockerfile
    container_name: vibedrive-api
    ports:
      - "5009:8080"
      - "7217:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Redis__ConnectionString=redis:6379
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:5173
      - Cors__AllowedOrigins__2=http://127.0.0.1:3000
      - Cors__AllowedOrigins__3=http://127.0.0.1:5173
      - Cors__AllowedOrigins__4=http://10.0.2.2:5009
      - Cors__AllowedOrigins__5=http://10.0.2.2:7217
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vibedrive-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    platform: linux/arm64
    container_name: vibedrive-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend-php
      - api
    networks:
      - vibedrive-network
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:

networks:
  vibedrive-network:
    driver: bridge

