services:
  redis:
    image: redis:7-alpine
    container_name: vibedrive-redis-prod
    volumes:
      - redis-data-prod:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - vibedrive-network-prod
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: vibedrive-mysql-prod
    volumes:
      - mysql-data-prod:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibedrive-network-prod
    restart: unless-stopped

  backend-php:
    build:
      context: ../backend-php
      dockerfile: Dockerfile
    container_name: vibedrive-backend-php-prod
    volumes:
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
      - SESSION_DOMAIN=${SESSION_DOMAIN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibedrive-network-prod
    restart: unless-stopped

  api:
    build:
      context: ../microservice-net
      dockerfile: VibeDrive.Api/Dockerfile
    container_name: vibedrive-api-prod
    volumes:
      - ../microservice-net/VibeDrive.Api/appsettings.Production.local.json:/app/appsettings.Production.local.json:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vibedrive-network-prod
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vibedrive-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/production.default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend-php
      - api
    networks:
      - vibedrive-network-prod
    restart: unless-stopped

volumes:
  redis-data-prod:
  mysql-data-prod:

networks:
  vibedrive-network-prod:
    driver: bridge
